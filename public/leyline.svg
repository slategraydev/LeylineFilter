<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .filter-diamond {
      stroke-width: 1.5;
      animation: diamond-pulse 3.2s infinite ease-in-out;
      transform-origin: center;
    }
    /* Dedicated glow layer to ensure intensity */
    .diamond-glow {
      stroke: #aa4141;
      stroke-width: 3;
      filter: url(#glow);
      animation: glow-pulse 3.2s infinite ease-in-out;
      transform-origin: center;
    }
    .leyline {
      stroke-width: 0.8;
      animation: flow 2.4s infinite linear;
    }
    .line-1 { animation-delay: 0s; }
    .line-2 { animation-delay: 0.8s; }
    .line-3 { animation-delay: 1.6s; }

    @keyframes diamond-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.95); stroke: #2d2d2d; }
      50% { opacity: 1; transform: scale(1); stroke: #aa4141; }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0; transform: scale(0.95); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 100; stroke-dasharray: 20 80; }
      100% { stroke-dashoffset: -100; stroke-dasharray: 20 80; }
    }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#aa4141" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Glow Layer -->
  <path d="M50 20 L80 50 L50 80 L20 50 Z" fill="none" class="diamond-glow" />

  <!-- Base Diamond -->
  <path d="M50 20 L80 50 L50 80 L20 50 Z" fill="none" class="filter-diamond" />

  <line x1="10" y1="45" x2="90" y2="45" stroke="url(#line-grad)" class="leyline line-1" />
  <line x1="10" y1="50" x2="90" y2="50" stroke="url(#line-grad)" class="leyline line-2" />
  <line x1="10" y1="55" x2="90" y2="55" stroke="url(#line-grad)" class="leyline line-3" />
</svg>
