[package]
name = "leylinefilter"
version = "0.1.0"
description = "A high-performance modular audio biometric sound gate and expander."
authors = ["Randall Rosas <randall@slategray.dev>"]
edition = "2021"
homepage = "https://github.com/slategraydev/leylinefilter"
repository = "https://github.com/slategraydev/leylinefilter"
license = "MIT"

[lib]
name = "leylinefilter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
anyhow = "1.0"
thiserror = "1.0"
rubato = "0.14"
ringbuf = "0.4"
log = "0.4"
env_logger = "0.11"
rustfft = "6.4.1"
sysinfo = "0.38.1"
nnnoiseless = "0.5.2"
crossbeam-channel = "0.5.15"
fundsp = "0.20"
